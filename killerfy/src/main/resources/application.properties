spring.application.name=killerfy
# ─── Base de datos MySQL ───────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/killerfy_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto
server.port=8080

# JWT
jwt.secret=killerfy-clave-super-secreta-minimo-32-caracteres-2024
jwt.expiracion=86400000

#problema de envio 
spring.jackson.serialization.fail-on-empty-beans=false

# ─── Mensajes de validacion en español ───────────────────
spring.messages.basename=messages

# Ruta donde se guardan los MP3 (relativa al directorio donde arranca Spring)
killerfy.uploads.dir=uploads/canciones

# Tamaño máximo de archivo subido (ajusta según tus MP3)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB